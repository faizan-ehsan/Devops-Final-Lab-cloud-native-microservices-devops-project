apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecom-dev
  labels:
    app: notification-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: notification-service:v1.0.0
        ports:
        - containerPort: 5004
        
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 128Mi
            
        env:
        - name: PORT
          value: "5004"
        - name: RABBITMQ_URI
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: RABBITMQ_URI
              
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 5004
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 5004
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecom-dev
spec:
  ports:
  - port: 5004
    targetPort: 5004
    protocol: TCP
  selector:
    app: notification-service
