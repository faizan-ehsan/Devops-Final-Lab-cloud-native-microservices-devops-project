apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecom-dev
  labels:
    app: order-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: order-service:v1.0.0
        ports:
        - containerPort: 5003
        
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
            
        env:
        - name: PORT
          value: "5003"
        - name: MONGO_URI
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: MONGO_ORDER_DB
        - name: RABBITMQ_URI
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: RABBITMQ_URI
        - name: PRODUCT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: PRODUCT_SERVICE_URL
        - name: NOTIFICATION_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: NOTIFICATION_SERVICE_URL
              
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 5003
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 5003
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecom-dev
spec:
  ports:
  - port: 5003
    targetPort: 5003
    protocol: TCP
  selector:
    app: order-service
