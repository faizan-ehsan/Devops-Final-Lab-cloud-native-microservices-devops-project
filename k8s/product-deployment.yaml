apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecom-dev
  labels:
    app: product-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
      - name: product-service
        image: product-service:v1.0.0
        ports:
        - containerPort: 5002
        
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
            
        env:
        - name: PORT
          value: "5002"
        - name: MONGO_URI
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: MONGO_PRODUCT_DB
              
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 5002
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 5002
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecom-dev
spec:
  ports:
  - port: 5002
    targetPort: 5002
    protocol: TCP
  selector:
    app: product-service
